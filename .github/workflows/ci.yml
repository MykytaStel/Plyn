name: CI

# Runs on every pull request, and is reused by deploy.yml before a release.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Lint, typecheck, test, build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, storage, property and DOM tests (with coverage)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; console.log('| | % |\n|---|---|\n| Lines | '+t.lines.pct+' |\n| Branches | '+t.branches.pct+' |\n| Functions | '+t.functions.pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: npm run build
