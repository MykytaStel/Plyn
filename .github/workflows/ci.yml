name: CI

# Runs on every pull request, and is reused by deploy.yml before a release.
# e2e needs checks, so a production deploy waits for the journeys too.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Lint, typecheck, test, build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, storage, property and DOM tests (with coverage)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; console.log('| | % |\n|---|---|\n| Lines | '+t.lines.pct+' |\n| Branches | '+t.branches.pct+' |\n| Functions | '+t.functions.pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: npm run build

      - name: Size budgets (scripts/budgets.json)
        run: npm run budgets

      - name: Lighthouse (performance, accessibility, best practices on a mobile profile)
        run: npx -y @lhci/cli@0.16.1 autorun

      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    name: End-to-end, accessibility and offline (Playwright)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Journeys CUJ-1…5, axe and keyboard (Chromium, WebKit, phone)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
