name: Preview

# IMP-13: every pull request gets its own Worker version with a stable alias URL
# (pr-<number>), so the release checklist runs on a real phone before merge.
# A preview has its own origin, so its IndexedDB never mixes with production.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Forks get no secrets; only branches of this repository are previewed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Upload preview version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload Worker version (no production traffic)
        id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.168.0'
          command: >-
            versions upload
            --preview-alias pr-${{ github.event.pull_request.number }}
            --tag pr-${{ github.event.pull_request.number }}
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"

      - name: Find preview URLs
        id: urls
        env:
          OUTPUT: ${{ steps.upload.outputs.command-output }}
        run: |
          alias_url=$(printf '%s\n' "$OUTPUT" | grep -oE 'https://pr-[0-9]+-[^ ]+\.workers\.dev' | head -n1 || true)
          version_url=$(printf '%s\n' "$OUTPUT" | grep -oE 'https://[0-9a-f]{8}-[^ ]+\.workers\.dev' | head -n1 || true)
          echo "alias=$alias_url" >> "$GITHUB_OUTPUT"
          echo "version=$version_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview"
            echo "- Stable: ${alias_url:-not found in wrangler output}"
            echo "- This commit: ${version_url:-not found in wrangler output}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the PR
        if: steps.urls.outputs.alias != '' || steps.urls.outputs.version != ''
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.urls.outputs.alias }}
          VERSION_URL: ${{ steps.urls.outputs.version }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- plyn-preview -->';
            const lines = [
              marker,
              '**Preview** (not production, separate storage)',
              '',
              process.env.ALIAS_URL ? `- Stable for this PR: ${process.env.ALIAS_URL}` : '',
              process.env.VERSION_URL ? `- This commit (\`${process.env.SHA.slice(0, 7)}\`): ${process.env.VERSION_URL}` : '',
              '',
              'Release checklist: docs/TESTING.md § Release checklist.'
            ].filter((line, i, all) => line !== '' || all[i - 1] !== '');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            const body = lines.join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
